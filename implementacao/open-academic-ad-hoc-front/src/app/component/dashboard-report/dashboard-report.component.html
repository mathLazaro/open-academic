<h3>SQL gerado</h3>
<p>{{ sql }}</p>

<h3>Relatório</h3>
<div>
  <button (click)="exportCsv()" [disabled]="data.length === 0">Exportar CSV</button
  ><button (click)="exportPdf()" [disabled]="data.length === 0">Exportar PDF</button>
</div>
@if (data.length > 0) {
<table>
  <thead>
    <tr>
      @for (col of columns; track col) {
      <th>{{ col }}</th>
      }
    </tr>
  </thead>
  <tbody>
    @for (row of data; track row) {
    <tr>
      @for (col of columns; track col) {
      <td>{{ row[col] }}</td>
      }
    </tr>
    }
  </tbody>
</table>
}
